<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provador Virtual Inteligente</title>
    <!-- Tailwind CSS via CDN para design limpo estilo Canva -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">✨ Provador Virtual com IA</h1>
        <p class="text-sm text-center text-slate-500 mb-6">Envie sua foto e a peça desejada para ver a montagem.</p>
        
        <div class="space-y-5">
            <!-- Upload da Pessoa -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">1. Sua Foto de Corpo Inteiro 📸</label>
                <input type="file" id="personFile" accept="image/*" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <!-- Upload da Roupa -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">2. Foto da Roupa 👕</label>
                <input type="file" id="garmentFile" accept="image/*" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <!-- Botão de Ação -->
            <button onclick="handleTryOn()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">
                Gerar Provador Virtual 🚀
            </button>
        </div>

        <!-- Indicador de Carregamento -->
        <div id="loading" class="hidden text-center mt-6 text-indigo-600 font-medium animate-pulse">
            Processando a montagem com IA... Aguarde alguns segundos ⏳
        </div>

        <!-- Área de Exibição do Resultado -->
        <div id="resultContainer" class="mt-6 hidden text-center border-t border-slate-100 pt-6">
            <h3 class="text-md font-semibold text-slate-700 mb-3">Resultado da Montagem:</h3>
            <img id="outputImage" src="" alt="Resultado Virtual" class="max-h-96 mx-auto rounded-lg shadow-md border border-slate-200">
        </div>
    </div>

    <script>
        function handleTryOn() {
            const personInput = document.getElementById('personFile').files[0];
            const garmentInput = document.getElementById('garmentFile').files[0];
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            
            if (!personInput || !garmentInput) {
                alert('Por favor, envie ambas as fotos para continuar!');
                return;
            }

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            // Aqui faremos a conexão com a API do Colab na próxima etapa
            setTimeout(() => {
                loading.classList.add('hidden');
                // Simulação visual utilizando a foto enviada para testes
                document.getElementById('outputImage').src = URL.createObjectURL(personInput);
                resultContainer.classList.remove('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
