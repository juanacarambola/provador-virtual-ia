<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Provador Virtual Inteligente</title>
    <!-- Tailwind CSS para um design limpo e moderno -->
    <script src="https://cdn.tailwindcss.com"></script&gt;
    <!-- Gradio Client para conectar facilmente com modelos públicos de IA -->
    <script type="module" src="https://gradio.s3-us-west-2.amazonaws.com/4.16.0/gradio.js"></script&gt;
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">🧥 Provador Virtual com IA</h1>
        <p class="text-sm text-center text-slate-500 mb-6">Envie sua foto de corpo inteiro e a peça de roupa para realizar a montagem.</p>
       
        <div class="space-y-5">
            <!-- Upload da Pessoa -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">1. Sua Foto de Corpo Inteiro 📸</label>
                <input type="file" id="personFile" accept="image/*" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50">
            </div>

            <!-- Upload da Roupa -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">2. Foto da Roupa (Isolada) 👕</label>
                <input type="file" id="garmentFile" accept="image/*" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50">
            </div>

            <!-- Botão de Ação -->
            <button onclick="handleTryOn()" id="submitBtn" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">
                Gerar Provador Virtual 🚀
            </button>
        </div>

        <!-- Indicador de Carregamento -->
        <div id="loading" class="hidden text-center mt-6 text-indigo-600 font-medium animate-pulse">
            processando a montagem com IA... Isso pode levar alguns segundos ⏳
        </div>

        <!-- Área de Exibição do Resultado -->
        <div id="resultContainer" class="mt-6 hidden text-center border-t border-slate-100 pt-6">
            <h3 class="text-md font-semibold text-slate-700 mb-3">✨ Resultado da Montagem:</h3>
            <img id="outputImage" src="" alt="Resultado Virtual" class="max-h-96 mx-auto rounded-lg shadow-md border border-slate-200">
        </div>
    </div>

    <script type="module">
        import { client } from "https://cdn.jsdelivr.net/npm/@gradio/client@0.1.4/dist/index.min.js&quot;;

        window.handleTryOn = async function() {
            const personInput = document.getElementById('personFile').files[0];
            const garmentInput = document.getElementById('garmentFile').files[0];
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const submitBtn = document.getElementById('submitBtn');
           
            if (!personInput || !garmentInput) {
                alert('⚠️ Por favor, envie ambas as imagens!');
                return;
            }

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                // Conectando ao espaço público otimizado de IDM-VTON no Hugging Face
                const app = await client("yisol/IDM-VTON");
               
                // Enviando as imagens para a API pública de IA
                const result = await app.predict("/tryon", [
                    { image: personInput, mask: null }, // Imagem da pessoa
                    garmentInput,                        // Imagem da roupa
                    "default description",
                    true,
                    true,
                    30,
                    2.5
                ]);

                if (result && result.data && result.data[0]) {
                    // Exibindo a imagem gerada pela IA real
                    document.getElementById('outputImage').src = result.data[0].url;
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error('Não foi possível processar a imagem.');
                }
            } catch (error) {
                console.error(error);
                alert('Ocorreu um erro ao processar na IA. Verifique se as imagens estão no formato correto (fundo limpo para a roupa).');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
