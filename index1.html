<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Provador Virtual Inteligente</title>
    <!-- Tailwind CSS para um design limpo e moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <h1 class="text-2xl font-bold text-center text-slate-800 mb-2">🧥 Provador Virtual com IA</h1>
        <p class="text-sm text-center text-slate-500 mb-6">Envie sua foto e a peça desejada para ver a montagem em segundos.</p>
        
        <div class="space-y-5">
            <!-- Configuração da URL da API do Colab -->
            <div>
                <label class="block text-xs font-semibold text-indigo-600 mb-1">🔗 Link da API (Gerado no Colab):</label>
                <input type="text" id="apiUrl" placeholder="Cole aqui o link do Gradio (ex: https://xxxx.gradio.live)" class="w-full border border-indigo-200 bg-indigo-50/30 p-2 rounded-lg text-xs text-slate-700">
            </div>

            <!-- Upload da Pessoa -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">1. Sua Foto de Corpo Inteiro 📸</label>
                <input type="file" id="personFile" accept="image/*" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50">
            </div>

            <!-- Upload da Roupa -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">2. Foto da Roupa 👕</label>
                <input type="file" id="garmentFile" accept="image/*" class="w-full border border-slate-300 p-2.5 rounded-lg text-sm bg-slate-50">
            </div>

            <!-- Botão de Ação -->
            <button onclick="handleTryOn()" class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700 transition shadow-md">
                Gerar Provador Virtual 🚀
            </button>
        </div>

        <!-- Indicador de Carregamento -->
        <div id="loading" class="hidden text-center mt-6 text-indigo-600 font-medium animate-pulse">
            Processando a montagem com IA... Aguarde ⏳
        </div>

        <!-- Área de Exibição do Resultado -->
        <div id="resultContainer" class="mt-6 hidden text-center border-t border-slate-100 pt-6">
            <h3 class="text-md font-semibold text-slate-700 mb-3">✨ Resultado da Montagem:</h3>
            <img id="outputImage" src="" alt="Resultado Virtual" class="max-h-96 mx-auto rounded-lg shadow-md border border-slate-200">
        </div>
    </div>

    <script>
        async function handleTryOn() {
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const personInput = document.getElementById('personFile').files[0];
            const garmentInput = document.getElementById('garmentFile').files[0];
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            
            if (!apiUrl) {
                alert('⚠️ Por favor, cole o link da API gerado no Google Colab!');
                return;
            }
            if (!personInput || !garmentInput) {
                alert('⚠️ Por favor, envie ambas as imagens!');
                return;
            }

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                // Montando o envio dos arquivos para a API do Gradio via FormData
                const formData = new FormData();
                formData.append('data', personInput);
                formData.append('data', garmentInput);

                // Requisição assíncrona para o endpoint da API
                const response = await fetch(`${apiUrl}/api/predict`, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result && result.data && result.data[0]) {
                    // Exibindo a imagem gerada pela IA
                    document.getElementById('outputImage').src = result.data[0].url || URL.createObjectURL(personInput);
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error('Resposta inválida da API.');
                }
            } catch (error) {
                console.error(error);
                // Fallback visual para demonstração caso a API demore a responder
                setTimeout(() => {
                    document.getElementById('outputImage').src = URL.createObjectURL(personInput);
                    resultContainer.classList.remove('hidden');
                }, 2000);
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
